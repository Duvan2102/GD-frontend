<div class="modal custom-backdrop" tabindex="-1" [class.show]="isVisible" [style.display]="isVisible ? 'block' : 'none'">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content department-creation-modal">

      <div class="modal-header">
        <h5 class="modal-title">{{ modalTitle }}</h5>  
        <button type="button" class="btn-close" aria-label="Cerrar" (click)="onCancel()"></button>
      </div>

      <form (ngSubmit)="onCreate()">
        <div class="modal-body text-center">
          <label for="nombreDepartamento" class="form-label">Nombre del Departamento</label>
          <input
            type="text"
            id="nombreDepartamento"
            class="form-control text-center"
            [(ngModel)]="nombreDepartamento"
            name="nombreDepartamento"
            placeholder="Escribe el nombre"
            required
          />
        </div>

        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="!nombreDepartamento.trim()">
          {{ mode === 'update' ? 'Actualizar' : 'Crear' }}
          </button>  
        </div>
      </form>

    </div>
  </div>
</div>
