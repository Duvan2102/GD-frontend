<div class="modal custom-backdrop" tabindex="-1" [class.show]="isVisible" [style.display]="isVisible ? 'block' : 'none'">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">{{ modalTitle }}</h5>
        <button type="button" class="btn-close" aria-label="Cerrar" (click)="onCancel()"></button>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="modal-body">
          <!-- Nombre del Área -->
          <div class="form-section">
            <label for="areaDescripcion" class="form-label">Nombre del Área</label>
            <input
              type="text"
              id="areaDescripcion"
              class="form-control"
              [(ngModel)]="area.descripcion"
              name="areaDescripcion"
              placeholder="Escribe el nombre del área"
              (ngModelChange)="validateOnChange()"
              required
              autocomplete="off"
            />
            <div *ngIf="errorMessage" class="text-danger mt-2 small">
              {{ errorMessage }}
            </div>
          </div>

          <!-- Selector de Departamento -->
          <div class="form-section">
            <label class="form-label">Departamento del Área</label>
            
            <!-- Vista de Árbol Compacta -->
            <div class="tree-compact">
              <!-- Departamento -->
              <div class="tree-level">
                <div class="level-header" (click)="toggleDepartmentDropdown()">
                  <div class="level-content">
                    <i class="bi bi-building"></i>
                    <span class="level-label">Departamento</span>
                    <span class="level-value" *ngIf="selectedDepartment">{{ selectedDepartment.descripcion }}</span>
                    <span class="level-placeholder" *ngIf="!selectedDepartment">Seleccionar</span>
                  </div>
                  <i class="bi" [class.bi-chevron-down]="!showDepartmentDropdown" [class.bi-chevron-up]="showDepartmentDropdown"></i>
                </div>
                
                <div *ngIf="showDepartmentDropdown" class="level-dropdown">
                  <div *ngIf="departmentsWithExpanded.length === 0" class="no-data">
                    <i class="bi bi-info-circle"></i>
                    No hay departamentos disponibles
                  </div>
                  <div *ngFor="let department of departmentsWithExpanded" class="level-item" (click)="selectDepartment(department)">
                    <i class="bi bi-building"></i>
                    <span>{{ department.descripcion }}</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Resumen de Selección -->
            <div *ngIf="selectedDepartment" class="selection-summary">
              <div class="summary-header">
                <i class="bi bi-check-circle-fill"></i>
                <span>Departamento seleccionado</span>
              </div>
              <div class="summary-path">
                <span class="path-item">
                  <i class="bi bi-building"></i>
                  {{ selectedDepartment.descripcion }}
                </span>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="!isFormValid"
          >
            {{ mode === 'update' ? 'Actualizar' : 'Crear' }}
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
