        <!-- Panel Derecho -->
<div class="right-panel">
    <div class="login-container">
      <h2>RESTABLECER CONTRASEÑA</h2>
  
        <!-- Formulario de solicitud de reset -->
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()" *ngIf="!showSuccessMessage">
          <p class="form-description">Ingresa tu usuario y te enviaremos un enlace para restablecer tu contraseña a tu correo empresarial.</p>
          
          <!-- Campo: Usuario -->
          <div>
            <input
              type="text"
              id="usuario"
              formControlName="usuario"
              class="input-field"
              required
              [class.error]="getFieldError('usuario')"
              placeholder="Ingrese su usuario"
              aria-invalid="!!getFieldError('usuario')"
              aria-describedby="usuario-error"
            />
            <div class="error-message" *ngIf="getFieldError('usuario')" id="usuario-error">
              {{ getFieldError('usuario') }}
            </div>
          </div>

          <!-- Mensaje de error general -->
          <div class="error-message general-error" *ngIf="errorMessage" role="alert" aria-live="polite">
            {{ errorMessage }}
          </div>

          <!-- Botones -->
          <div class="buttons-container">
            <button
              type="submit"
              class="login-button"
              [disabled]="isLoading"
              [class.loading]="isLoading"
            >
              <span *ngIf="!isLoading">Solicitar Restablecimiento</span>
              <span *ngIf="isLoading">Enviando...</span>
            </button>

            <button
              type="button"
              class="secondary-button"
              (click)="goToLogin()"
            >
              Volver al Login
            </button>
          </div>
        </form>

        <!-- Mensaje de éxito -->
        <div class="success-message" *ngIf="showSuccessMessage && successMessage" role="status" aria-live="polite">
          <i class="fas fa-check-circle"></i>
          {{ successMessage }}
          
          
          <div class="buttons-container">
            <button
              type="button"
              class="login-button"
              (click)="goToLogin()"
            >
              Volver al Login
            </button>

            <button
              type="button"
              class="secondary-button"
              (click)="makeAnotherRequest()"
            >
              Hacer Otra Solicitud
            </button>
          </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>

            <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        </div>
