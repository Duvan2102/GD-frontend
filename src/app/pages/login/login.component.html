<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Sistema de Gestión</h1>
      <p>Iniciar Sesión</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input
          type="text"
          id="usuario"
          formControlName="usuario"
          class="form-control"
          [class.error]="getFieldError('usuario')"
          placeholder="Ingrese su usuario"
        />
        <div class="error-message" *ngIf="getFieldError('usuario')">
          {{ getFieldError('usuario') }}
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          [class.error]="getFieldError('password')"
          placeholder="Ingrese su contraseña"
        />
        <div class="error-message" *ngIf="getFieldError('password')">
          {{ getFieldError('password') }}
        </div>
      </div>

      <div class="error-message general-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading"
        [class.loading]="isLoading"
      >
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading">Iniciando...</span>
      </button>
    </form>

    <div class="login-footer">
      <p>Usuarios de prueba disponibles:</p>
      <div class="test-users">
        <div class="test-user" *ngFor="let user of testUsers" (click)="fillTestUser(user)">
          <strong>{{ user.usuario }}</strong> - {{ user.nombres }} {{ user.apellidos }}
        </div>
      </div>
    </div>
  </div>
</div>
