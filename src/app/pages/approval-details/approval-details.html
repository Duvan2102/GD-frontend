<div class="principal-wrapper">
  <div class="container-fluid p-4">

    <div class="seccion-cabecera">
      <h2>DETALLES APROBACIONES</h2>
    </div>

    <app-controls
      [labelAprobados]="'CANCELADAS/RECHAZADAS'"
      (quantityChange)="onQuantityChange($event)"
      (toggleApprovedChange)="onToggleManaged($event)"
      (searchChange)="onSearchChange($event)">
    </app-controls>

    <app-requests-table
      [requests]="displayedRequests"
      [totalItems]="totalFiltered"
      [currentOrder]="currentOrder"
      [ascendingOrder]="ascendingOrder"
      [isToggleActive]="showOnlyManaged"
      [viewType]="'approval-details'"
      (sort)="sortBy($event)"
      (manage)="onManage($event)">
    </app-requests-table>

    <app-footer-controls
      [totalItems]="totalFiltered"
      [itemsPerPage]="itemsPerPage"
      [currentPage]="currentPage"
      (changePage)="onChangePage($event)"
    ></app-footer-controls>

  </div>
</div>

<!-- Loading overlay for historic fetch -->
<div *ngIf="isLoading" class="loading-overlay">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
  <div class="mt-2">Cargando historial...</div>
  <style>
    .loading-overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,0.6);z-index:1050}
  </style>
</div>
