<div class="row mb-2 align-items-center" *ngIf="showToggle; else noToggle">
  <div class="col-md-auto">
    <div class="d-flex align-items-center gap-2" style="height: 60px;">
      <label for="mostrar" class="form-label mb-0 text-secondary">{{ labelMostrar }}</label>
      <select id="mostrar" class="form-select form-select-sm" style="width: 80px;"
        (change)="quantityChange.emit($any($event.target).value)">
        <option>10</option>
        <option>25</option>
        <option>50</option>
        <option>100</option>
      </select>
      <span class="text-secondary">{{ textoEntradas }}</span>
    </div>
  </div>
  <div class="col-md">
    <div class="d-flex flex-column align-items-end gap-3">
      <div class="form-check form-switch" *ngIf="showToggleSwitch">
        <label for="toggleAprobados" class="form-label mb-0 text-secondary">
          {{ toggleApproved ? labelAprobados : (labelAprobadosInactivo || labelAprobados) }}
        </label>
        <label class="switch">
          <input type="checkbox" id="toggleAprobados"
                 [checked]="toggleApproved"
                 (change)="toggleApprovedChange.emit($any($event.target).checked)">
          <span class="slider"></span>
        </label>
      </div>
      <div class="d-flex align-items-center gap-3">
        <label for="buscar" class="form-label mb-0 text-secondary">{{ labelBuscar }}</label>
        <input type="text" id="buscar" class="form-control form-control-sm"
          style="width: 300px;"
          [placeholder]="placeholderBuscar"
          (input)="searchChange.emit($any($event.target).value)">
      </div>
    </div>
  </div>
</div>

<ng-template #noToggle>
  <div class="row mb-2 align-items-center">
    <div class="col-md-12">
      <div class="d-flex justify-content-center">
        <div class="d-flex align-items-center gap-3">
          <label for="buscar" class="form-label mb-0 text-secondary">{{ labelBuscar }}</label>
          <input type="text" id="buscar" class="form-control form-control-sm"
            style="width: 300px;"
            [placeholder]="placeholderBuscar"
            (input)="searchChange.emit($any($event.target).value)">
        </div>
      </div>
    </div>
  </div>
</ng-template>
