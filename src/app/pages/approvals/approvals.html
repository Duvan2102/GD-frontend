<!-- Contenedor de alertas externas -->
<div class="external-alerts-container">
  <div *ngFor="let alert of externalAlerts; let i = index"
       class="external-alert"
       [ngClass]="'alert-' + alert.type">
    <i class="external-alert-icon"
       [ngClass]="{
         'bi bi-check-circle-fill': alert.type === 'success',
         'bi bi-exclamation-triangle-fill': alert.type === 'danger',
         'bi bi-info-circle-fill': alert.type === 'info',
         'bi bi-exclamation-circle-fill': alert.type === 'warning'
       }"></i>
    <div class="external-alert-content">
      <div class="external-alert-title">{{ alert.title }}</div>
      <p class="external-alert-message">{{ alert.message }}</p>
    </div>
    <button class="external-alert-close" (click)="closeExternalAlert(i)">
      <i class="bi bi-x"></i>
    </button>
  </div>
</div>

<div class="principal-wrapper">
  <div class="container-fluid p-4">

    <div class="seccion-cabecera">
      <h2>APROBACIONES</h2>
    </div>

    <app-controls
      [labelAprobados]="'GESTIONADOS'"
      [labelAprobadosInactivo]="'PENDIENTES'"
      [toggleApproved]="showOnlyManaged"
      (quantityChange)="onQuantityChange($event)"
      (toggleApprovedChange)="onToggleManaged($event)"
      (searchChange)="onSearchChange($event)">
    </app-controls>

    <app-requests-table
      [requests]="displayedRequests"
      [totalItems]="totalFiltered"
      [currentOrder]="currentOrder"
      [ascendingOrder]="ascendingOrder"
      [isToggleActive]="showOnlyManaged"
      [viewType]="'approvals'"
      (sort)="sortBy($event)"
      (manage)="onManage($event)">
    </app-requests-table>

    <app-footer-controls
      [totalItems]="totalFiltered"
      [itemsPerPage]="itemsPerPage"
      [currentPage]="currentPage"
      (changePage)="onChangePage($event)"
    ></app-footer-controls>

  </div>
</div>

<app-request-success-modal
  [isVisible]="isDetailModalVisible"
  [data]="successModalData"
  [usuariosDisponibles]="allUsers"
  [currentUser]="currentUser"
  [isApprovalFlow]="true"
  [hideManageButton]="showOnlyManaged"
  [hideViewDocumentButton]="true"
  (close)="closeDetailModal()"
  (manageRequest)="handleOpenDocumentToApprove($event)"
  (viewApprovedDocument)="handleViewApprovedDocument($event)"> 
</app-request-success-modal>

<app-approval-document-view
  [isVisible]="isApprovalDocumentViewVisible"
  [documentData]="documentToApproveData"
  (close)="closeApprovalDocumentView()"
  (back)="handleBackFromDocumentView()"
  (approve)="handleApproveRequest($event)"
  (reject)="handleRejectRequest($event)">
</app-approval-document-view>

<app-document-view
  [isVisible]="isDocumentViewVisible"
  [documentData]="documentViewData"
  [hideManagementButtons]="true"
  [hideSendButton]="true"
  (close)="closeDocumentView()">
</app-document-view>

<!-- Loading overlay for detail fetch -->
<div *ngIf="isLoadingDetails" class="loading-overlay">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
  <div class="mt-2">Cargando detalles...</div>
  <style>
    .loading-overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,0.6);z-index:1050}
  </style>
</div>
