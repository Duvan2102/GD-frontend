<div class="custom-backdrop" [class.show]="visible" (click)="aceptar.emit()"></div>

<div class="modal" tabindex="-1" [class.show]="visible" [style.display]="visible ? 'block' : 'none'" (click)="aceptar.emit()">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content password-modal" (click)="$event.stopPropagation()">

      <div class="modal-header">
        <h5 class="modal-title">Notificación</h5>
        <button type="button" class="btn-close" aria-label="Cerrar" (click)="aceptar.emit()"></button>
      </div>

      <div class="modal-body text-center">
        <div class="success-icon-container mb-3">
          <i class="fas fa-check-circle success-icon-large"></i>
        </div>
        <h2 class="modal-title-custom mb-3">{{ mensaje }}</h2>
        @if (mensajeSecundario) {
          <p class="mensaje-secundario mb-4">{{ mensajeSecundario }}</p>
        }
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="aceptar.emit()">
          {{ textoBtn || 'Aceptar' }}
        </button>
      </div>

    </div>
  </div>
</div>
