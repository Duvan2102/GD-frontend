<div class="modal custom-backdrop" tabindex="-1"
     [class.show]="isVisible"
     [style.display]="isVisible ? 'block' : 'none'">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content password-modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h5 class="modal-title">Crear Contraseña</h5>
        <button type="button" class="btn-close" (click)="onCancelChange()" aria-label="Cerrar"></button>
      </div>
      <form (ngSubmit)="onChangePassword()" autocomplete="off">
        <div class="modal-body">
          <h4 class="text-center">Ingresa tu nueva contraseña.</h4>
          <div class="input-group mb-3 password-input-wrapper">
            <input
              [type]="newPasswordVisible ? 'text' : 'password'"
              class="form-control"
              [(ngModel)]="nuevaPassword"
              [ngModelOptions]="{standalone: true}"
              name="newPassword"
              placeholder="Nueva contraseña"
              required
              autocomplete="new-password"
              #passwordInput>
            <button type="button" class="btn btn-outline-secondary" (click)="toggleNewPasswordVisibility()" tabindex="-1">
              <i [class]="newPasswordVisible ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
            <div class="password-info-btn-wrapper">
              <button type="button" class="btn btn-link password-info-btn" tabindex="0" aria-label="Ver requisitos de contraseña">
                <i class="bi bi-info-circle"></i>
              </button>
              <!-- Condiciones para la contraseña -->
              <div class="password-requirements-tooltip">
                <div class="tooltip-arrow"></div>
                <p class="tooltip-title">La contraseña debe cumplir con:</p>
                <ul class="tooltip-list">
                  <li [style.color]="checkPasswordCondition('minLength') ? '#28a745' : '#dc3545'">
                    <i [class]="checkPasswordCondition('minLength') ? 'fas fa-check-circle' : 'fas fa-times-circle'"></i>
                    Tener al menos 10 caracteres
                  </li>
                  <li [style.color]="checkPasswordCondition('uppercase') ? '#28a745' : '#dc3545'">
                    <i [class]="checkPasswordCondition('uppercase') ? 'fas fa-check-circle' : 'fas fa-times-circle'"></i>
                    Incluir letras en mayúscula
                  </li>
                  <li [style.color]="checkPasswordCondition('lowercase') ? '#28a745' : '#dc3545'">
                    <i [class]="checkPasswordCondition('lowercase') ? 'fas fa-check-circle' : 'fas fa-times-circle'"></i>
                    Incluir letras en minúscula
                  </li>
                  <li [style.color]="checkPasswordCondition('specialChar') ? '#28a745' : '#dc3545'">
                    <i [class]="checkPasswordCondition('specialChar') ? 'fas fa-check-circle' : 'fas fa-times-circle'"></i>
                    Incluir signos especiales
                  </li>
                  <li [style.color]="checkPasswordCondition('noPersonalData') ? '#28a745' : '#dc3545'">
                    <i [class]="checkPasswordCondition('noPersonalData') ? 'fas fa-check-circle' : 'fas fa-times-circle'"></i>
                    No contener datos personales
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div class="input-group">
            <input
              [type]="confirmPasswordVisible ? 'text' : 'password'"
              class="form-control"
              [(ngModel)]="confirmPassword"
              [ngModelOptions]="{standalone: true}"
              name="confirmPassword"
              placeholder="Confirmar nueva contraseña"
              required
              autocomplete="new-password">
            <button type="button" class="btn btn-outline-secondary" (click)="toggleConfirmPasswordVisibility()" tabindex="-1">
              <i [class]="confirmPasswordVisible ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
          <div *ngIf="changePasswordError" class="text-danger mt-2">{{ changePasswordError }}</div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" [disabled]="!nuevaPassword || !confirmPassword">Guardar</button>
          <button type="button" class="btn btn-secondary" (click)="onCancelChange()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
