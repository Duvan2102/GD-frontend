<div class="modal custom-backdrop" tabindex="-1" [class.show]="isVisible" [style.display]="isVisible ? 'block' : 'none'" (click)="onCancel()">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content password-modal" (click)="$event.stopPropagation()">

      <div class="modal-header">
        <h5 class="modal-title">Ingresar contraseña</h5>
        <button type="button" class="btn-close" aria-label="Cerrar" (click)="onCancel()"></button>
      </div>

      <form (ngSubmit)="onValidate()">
        <div class="modal-body text-center">
          <p class="mb-4">{{ mensajeModal }}</p>
          <div class="input-group">
            <input
              #passwordInput
              [type]="passwordVisible ? 'text' : 'password'"
              class="form-control"
              [(ngModel)]="password"
              name="password"
              placeholder="Contraseña"
              required
              autocomplete="current-password"
              [disabled]="isValidating"
            />
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [disabled]="isValidating"
              tabindex="-1"
            >
              <i [class]="passwordVisible ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
          @if (errorMessage) {
          <div class="alert alert-danger mt-3 mb-0" role="alert">
            {{ errorMessage }}
          </div>
          }
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isValidating">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="!password.trim() || isValidating">
            @if (isValidating) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            }
            {{ isValidating ? 'Validando...' : 'Validar' }}
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
