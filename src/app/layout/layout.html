<!-- Contenedor de alertas externas -->
<div class="external-alerts-container">
  <div *ngFor="let alert of externalAlerts; let i = index"
       class="external-alert"
       [ngClass]="'alert-' + alert.type">
    <i class="external-alert-icon"
       [ngClass]="{
         'bi bi-check-circle-fill': alert.type === 'success',
         'bi bi-exclamation-triangle-fill': alert.type === 'danger',
         'bi bi-info-circle-fill': alert.type === 'info',
         'bi bi-exclamation-circle-fill': alert.type === 'warning'
       }"></i>
    <div class="external-alert-content">
      <div class="external-alert-title">{{ alert.title }}</div>
      <p class="external-alert-message">{{ alert.message }}</p>
    </div>
    <button class="external-alert-close" (click)="closeExternalAlert(i)">
      <i class="bi bi-x"></i>
    </button>
  </div>
</div>

<div class="d-flex flex-column vh-100">
  <header class="d-flex justify-content-between align-items-center bg-light px-3 py-2">
    <div class="header-left">
      <h1 class="h4 mb-0" style="font-family: cursive;">Gestor Documental</h1>
    </div>
    <div class="d-flex align-items-center">
      <div class="text-end me-3 small" *ngIf="currentUser">
        <div>PROASISTEMAS S.A.</div>
        <div>{{ currentUser.nombres }} {{ currentUser.apellidos }}</div>
        <div>{{ currentUser.cargo.descripcion }}</div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center user-avatar"
             style="width:40px; height:40px; cursor: pointer;"
             (click)="openProfileModal()"
             title="Ver perfil">
          {{ getInitials() }}
        </div>
        <button class="btn btn-outline-danger btn-sm" (click)="logout()" title="Cerrar Sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </header>
  <div class="d-flex flex-grow-1 overflow-hidden">
    <aside class="text-white ms-3 flex-shrink-0" style="width:16.6667%;">
      <app-sidebar></app-sidebar>
    </aside>
    <main class="flex-grow-1 bg-white p-3 me-3 overflow-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
  <footer class="bg-light shadow-sm d-flex justify-content-between align-items-center px-3 py-2">
    <div class="d-flex align-items-center">
      <button class="btn btn-link p-0 me-2" (click)="openAboutModal()" title="Acerca de" style="text-decoration: none; color: #6c757d;">
        <i class="bi bi-info-circle" style="font-size: 1.2rem;"></i>
      </button>
    </div>
    <div class="text-end">
      © 2025 PROAsistemas S.A.
    </div>
  </footer>
</div>

<!-- Profile Modal -->
<app-profile-modal 
  [isVisible]="isProfileModalVisible" 
  [user]="currentUser" 
  (close)="closeProfileModal()"
  (save)="onSaveProfile($event)"
  (showAlert)="showExternalAlert($event.type, $event.title, $event.message)">
</app-profile-modal>

<div class="modal fade" [class.show]="isAboutModalVisible" [style.display]="isAboutModalVisible ? 'block' : 'none'" tabindex="-1" role="dialog" *ngIf="isAboutModalVisible">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Acerca de</h5>
        <button type="button" class="btn-close" (click)="closeAboutModal()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-center">Propiedad del producto PROASISTEMAS</p>
        <p class="text-center"><strong>Autores:</strong> Duvan Urrego y Luis Perez</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-secondary" (click)="closeAboutModal()">Cerrar</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="isAboutModalVisible" *ngIf="isAboutModalVisible" (click)="closeAboutModal()"></div>
